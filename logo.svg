<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b7cf7" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161626" />
      <stop offset="100%" stop-color="#0b0b12" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Badge Background -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" stroke="url(#grad)" stroke-width="14" stroke-opacity="0.5" />
  
  <!-- Ambient Inner Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#grad)" opacity="0.12" filter="url(#glow)" />

  <!-- Bold Geometric V with Integrated AI Bolt -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Stroke of V -->
    <path d="M140 144 L256 368" stroke="url(#grad)" stroke-width="52" />
    <!-- Right Stroke of V -->
    <path d="M372 144 L256 368" stroke="url(#grad)" stroke-width="52" />
    <!-- Inner High-tech AI Diamond Core -->
    <polygon points="256,160 286,210 256,260 226,210" fill="#5eead4" filter="url(#glow)" />
  </g>
</svg>
